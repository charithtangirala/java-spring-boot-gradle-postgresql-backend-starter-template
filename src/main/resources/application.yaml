spring:
  application:
    name: template
  profiles:
    active: dev

server:
  port: 8080

logging:
  level:
    root: INFO
    com.template: DEBUG

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/template_dev_db
    username: postgres
    password: password
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:4200"

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:proddb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:secret}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate